# Nginx：上传目录 MIME + nosniff + 禁止脚本执行（审计 #25）
# 将本片段并入站点 server{}；二级目录部署时请按实际路径调整 location 前缀。
# Apache 请使用 rewrite/static-upload.htaccess → static/upload/.htaccess（upload_ensure_htaccess 自动部署）。
#
# SVGZ 为 gzip 压缩的 SVG：必须带 Content-Encoding: gzip，否则浏览器按 XML 解析压缩字节会失败。
# 子 location 内 add_header 不继承父级，故 nosniff 须重复声明；gzip off 避免对已压缩内容再压一层。

location ^~ /static/upload/ {
    types {
        image/svg+xml svg svgz;
        image/avif avif;
        image/webp webp;
    }
    default_type application/octet-stream;
    add_header X-Content-Type-Options "nosniff" always;

    location ~* ^/static/upload/.*\.(php|phtml|php3|php4|php5|php7|php8|phps|phar|cgi|pl|asp|aspx|jsp)$ {
        deny all;
    }

    location ~* \.svgz$ {
        default_type image/svg+xml;
        gzip off;
        add_header Content-Encoding gzip always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
