        <div class="bd-callout bd-callout-info">
            <h4>独立手机版</h4>
            <p>启用独立手机版可以PC/移动分别设置模板</p>
            <p>
                <span style="color: rgb(255, 0, 0);">默认模板为响应式模板，无需开启独立手机版本</span>
            </p>
        </div>
        <h4>步骤说明</h4>
        <ul class="list-group list-paddingleft-2">
            <li>
                <p>1）在后台配置中开启手机版开关；</p>
            </li>
            <li>
                <p>2）在PC模板目录下面建立wap目录，放入模板文件，各模板文件名同PC。例如：default/wap，需要注意的是：如果启用了模板子目录，那么PC版本的目录为default/子目录，手机模板路径为default/wap/子目录；</p>
            </li>
            <li>
                <p>3）使用手机或者浏览器模拟手机进行访问。</p>
                <p>
                    <br/>
                </p>
            </li>
        </ul>
