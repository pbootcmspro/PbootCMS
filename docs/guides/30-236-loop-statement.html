<div class="tab-pane fade active show">
    <div class="bd-callout bd-callout-info">
        <h4>lopp循环语句使用</h4>
        <p>标签作用：用于根据循环输出一段内容</p>
    </div>
    <h4 class="mt-3">1、Loop语句格式</h4>
    <code>
        <p>{pboot:loop start=* end=*}</p>
        <p>  &amp;lt;p&amp;gt;这是第[loop:i]次，索引号为[loop:index]&amp;lt;/p&amp;gt;</p>
        <p>{/pboot:loop}</p>
    </code>
    <div class="bd-callout bd-callout-info">
        <p>控制参数：</p>
        <p>start=* 起始数字,默认1开始</p>
        <p>end=* 结束数字，必填</p>
    </div>
</div>
